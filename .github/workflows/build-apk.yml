name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Package Android configuration template
        run: |
          mkdir -p android/app/src/main/assets
          cp config.yaml.example android/app/src/main/assets/config.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pure-Go Android ARM64 server library
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libhealthtrack.so ./cmd/server

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_BASE64，无法进行固定签名构建"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/healthtrack-release.jks"
          test -s "$RUNNER_TEMP/healthtrack-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/healthtrack-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version and commit hash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)
          SHORT_SHA="${GITHUB_SHA::7}"
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          APK_NAME="HealthTrack-v${VERSION}-${SHORT_SHA}.apk"
          cp "$APK" "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Renamed to $APK_NAME"

      - name: Send APK via QQ email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "HealthTrack APK 构建完成 v${{ env.VERSION }} (${{ env.SHORT_SHA }})"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            HealthTrack APK 已自动构建完成，请查收附件并安装到手机。

            版本号：v${{ env.VERSION }}
            版本代码（versionCode）：${{ github.run_number }}
            提交哈希：${{ github.sha }}
            提交信息：${{ github.event.head_commit.message }}
            仓库：${{ github.repository }}
            运行链接：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: ${{ env.APK_NAME }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: HealthTrack-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7