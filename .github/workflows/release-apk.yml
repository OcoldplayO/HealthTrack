name: Release APK

# 推送形如 v0.9.0-beta 的 tag 时自动触发；也可在 Actions 页面手动指定已有 tag 重新发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（须已存在，例如 v0.9.0-beta）'
        required: true
        type: string

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          # 手动触发时检出指定 tag，tag 推送时检出该 tag
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release tag
        run: |
          set -euo pipefail
          TAG_NAME="${{ inputs.tag }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "发布标签：${TAG_NAME}"

      - name: Package Android configuration template
        run: |
          mkdir -p android/app/src/main/assets
          cp config.yaml.example android/app/src/main/assets/config.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build pure-Go Android ARM64 server library
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libhealthtrack.so ./cmd/server

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode signing keystore
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_BASE64，无法进行固定签名构建"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/healthtrack-release.jks"
          test -s "$RUNNER_TEMP/healthtrack-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/healthtrack-release.jks" >> "$GITHUB_ENV"

      - name: Stamp versionName from tag
        run: |
          set -euo pipefail
          # tag v0.9.0-beta → versionName 0.9.0-beta
          VERSION_NAME="${TAG_NAME#v}"
          sed -i "s/versionName '[^']*'/versionName '${VERSION_NAME}'/" android/app/build.gradle
          grep "versionName '" android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK with version and commit hash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          APK_NAME="HealthTrack-v${VERSION_NAME}-${SHORT_SHA}.apk"
          cp "$APK" "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Renamed to $APK_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: HealthTrack ${{ env.VERSION_NAME }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          draft: false
          # beta / alpha / rc 自动标记为预发布版本
          prerelease: ${{ contains(env.VERSION_NAME, 'beta') || contains(env.VERSION_NAME, 'alpha') || contains(env.VERSION_NAME, 'rc') }}
          body: |
            HealthTrack ${{ env.VERSION_NAME }} 构建完成。

            - 版本号：v${{ env.VERSION_NAME }}
            版本代码（versionCode）：${{ github.run_number }}
            提交哈希：${{ env.SHORT_SHA }}
            构建运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            安装说明：下载下方 APK 附件后覆盖安装即可（与 CI/本地包共用同一签名，不会清空数据）。
